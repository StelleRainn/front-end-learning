<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<!--
    v-show 和 v-if 都可以控制元素的显示隐藏
    语法：v-show = "表达式", v-if = "表达式", 表达式为 true 则显示, 表达式为 false 则隐藏
    差异： v-show 的隐藏是通过控制 css 属性 display: none, 而 v-if 是控制 DOM 元素的创建与否
    前者适合于频繁切换的场景，后者反之
-->

<div id="app">
    <div v-show="flag" v-html="msg"></div>
    <div v-if="flag" v-html="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<script>
    const app = new Vue({
        el: '#app',
        data: {
            flag: false,
            msg: 'Hello Vue',
        }
    })
</script>

</body>
</html>
