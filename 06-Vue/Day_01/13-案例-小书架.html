<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<!--
    目标一：渲染所有书本信息
    目标二：删除指定书本
-->

<!--
    v-for 中的 key
    作用：给元素添加的唯一标识，便于Vue进行列表项的正确排序和复用。
    注意点：
        1. key的值只能是字符串或数字类型
        2. key的值必须具有唯一性
        3. 推荐使用id作为key，不推荐使用index（会变化）
-->

<div id="app">
    <h3>小黑的书架</h3>
    <ul>
        <li v-for="(item, index) in booksList" :key="item.id" >
            <span> {{ item.name }} </span>
            <span>{{ item.author }}</span>

<!--            注册点击事件，根据id进行删除-->
            <button @click="fn( item.id )">删除</button>
        </li>
    </ul>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
<script>
  const app = new Vue({
    el: '#app',
    data: {
      booksList: [
        { id: 1, name: '《红楼梦》', author: '曹雪芹' },
        { id: 2, name: '《西游记》', author: '吴承恩' },
        { id: 3, name: '《水浒传》', author: '施耐庵' },
        { id: 4, name: '《三国演义》', author: '罗贯中' }
      ]
    },
    methods: {
      // 使用 数组filter 方法
      fn (bookID) {
        this.booksList = this.booksList.filter(item => item.id !== bookID )
      }
    }
  })
</script>
</body>
</html>
