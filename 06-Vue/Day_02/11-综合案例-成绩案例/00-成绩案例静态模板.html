<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/index.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="app" class="score-case">
      <div class="table">
        <table>
          <thead>
            <tr>
              <th>编号</th>
              <th>科目</th>
              <th>成绩</th>
              <th>操作</th>
            </tr>
          </thead>

            <!-- 目标一：基础渲染-->
            <!-- 使用 v-if 和 v-else 控制渲染 -->
          <tbody v-if="list.length > 0">
            <!-- v-for 循环渲染 -->
            <tr v-for="(item, index) in list" :key="item.id">
              <td>{{ index + 1 }}</td>
              <td>{{ item.subject }}</td>
              <!-- v-bind 控制类名 -->
              <td :class="{ red: item.score < 60 }">{{ item.score }}</td>

              <!--  目标二：删除功能-->
              <td><a @click.prevent="del(item.id)" href="#">删除</a></td>
            </tr>
          </tbody>


          <tbody v-else>
            <tr>
              <td colspan="5">
                <span class="none">暂无数据</span>
              </td>
            </tr>
          </tbody>

          <tfoot>
            <tr>
              <td colspan="5">
                <span>总分：{{ total }}</span>
                <span style="margin-left: 50px">平均分：{{ average }}</span>
              </td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!--  目标三：添加成绩-->
      <div class="form">
        <div class="form-item">
          <div class="label">科目：</div>
          <div class="input">
            <input
              type="text"
              placeholder="请输入科目"
              v-model.trim="subject"
            />
          </div>
        </div>
        <div class="form-item">
          <div class="label">分数：</div>
          <div class="input">
            <input
              type="text"
              placeholder="请输入分数"
              v-model.number="score"
            />
          </div>
        </div>
        <div class="form-item">
          <div class="label"></div>
          <div class="input">
            <button class="submit"  @click="add">添加</button>
          </div>
        </div>
      </div>
    </div>
    <script src="../vue.js"></script>

    <script>
      const app = new Vue({
        el: '#app',
        data: {
          list: [
            { id: 1, subject: '语文', score: 20 },
            { id: 7, subject: '数学', score: 99 },
            { id: 12, subject: '英语', score: 70 },
          ],
          subject: '',
          score: ''
        },

        methods: {
          // 删除功能
          del (id) {
            this.list =  this.list.filter(item => item.id !== id )
          },

          // 添加成绩
          add () {
            if (this.subject === '') {
              alert('请输入科目')
              return
            }

            if ( typeof this.score !== 'number') {
              alert('请输入正确成绩')
              return
            }

            this.list.unshift({
              id: +new Date(),
              subject: this.subject,
              score: this.score,
            })

            this.subject = ''
            this.score = ''
          }
        },

        computed: {
          total () {
            return this.list.reduce((acc, curr) => acc + curr.score, 0 );
          },

          average () {
            if (this.list.length === 0) return 0;
            return (this.total / this.list.length).toFixed(2)
          }
        }

      })
    </script>
  </body>
</html>
