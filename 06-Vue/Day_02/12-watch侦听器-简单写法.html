<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-size: 18px;
      }
      #app {
        padding: 10px 20px;
      }
      .query {
        margin: 10px 0;
      }
      .box {
        display: flex;
      }
      textarea {
        width: 300px;
        height: 160px;
        font-size: 18px;
        border: 1px solid #dedede;
        outline: none;
        resize: none;
        padding: 10px;
      }
      textarea:hover {
        border: 1px solid #1589f5;
      }
      .transbox {
        width: 300px;
        height: 160px;
        background-color: #f0f0f0;
        padding: 10px;
        border: none;
      }
      .tip-box {
        width: 300px;
        height: 25px;
        line-height: 25px;
        display: flex;
      }
      .tip-box span {
        flex: 1;
        text-align: center;
      }
      .query span {
        font-size: 18px;
      }

      .input-wrap {
        position: relative;
      }
      .input-wrap span {
        position: absolute;
        right: 15px;
        bottom: 15px;
        font-size: 12px;
      }
      .input-wrap i {
        font-size: 20px;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 条件选择框 -->
      <div class="query">
        <span>翻译成的语言：</span>
        <select v-model="obj.lang">
          <option value="italy">意大利</option>
          <option value="english">英语</option>
          <option value="german">德语</option>
        </select>
      </div>

      <!-- 翻译框 -->
      <div class="box">
        <div class="input-wrap">
          <textarea v-model="obj.words"></textarea>
          <span><i>⌨️</i>文档翻译</span>
        </div>
        <div class="output-wrap">
          <div class="transbox">{{ result }}</div>
        </div>
      </div>
    </div>
    <script src="./vue.js"></script>
    <script src="./axios.js"></script>
    <script>
      // 接口地址：https://applet-base-api-t.itheima.net/api/translate
      // 请求方式：get
      // 请求参数：
      // （1）words：需要被翻译的文本（必传）
      // （2）lang： 需要被翻译成的语言（可选）默认值-意大利
      // -----------------------------------------------
      
      const app = new Vue({
        el: '#app',
        data: {
          words: '',

          obj: {
            words: 'defalut',
            lang: 'italy',
          },

          result: ''
        },

       // (1) watch 语法的简单写法
       // watch: {
       //   //  根级别的属性直接侦听
       //   // words (newVal, oldVal) {
       //   //   console.log(newVal, oldVal);
       //   // }
       //
       //   // 对象中的子属性，需要提供路径，注意添加引号
       //   // 'obj.words' (newVal, oldVal) {
       //   //   console.log(newVal, oldVal);
       //   // }
       //
       //   // 包含业务逻辑：axios请求与防抖
       //   'obj.words' (newVal) {
       //     // 防抖：触发侦听后，检测有无定时器，有则清除，启动新的定时器
       //     if (this.timer) clearTimeout(this.timer);
       //     this.timer = setTimeout( async () => {
       //       const res = await axios({
       //         method: 'get',
       //         url: 'https://applet-base-api-t.itheima.net/api/translate',
       //         params: {
       //           words: newVal
       //         }
       //       })
       //       console.log(res.data.data)
       //       this.result = res.data.data
       //     }, 300)
       //   }
       // }

      //  (2) watch 完整语法
      //   业务逻辑：只要 words 或 lang 之中的任何一个发生变化，就被侦听
        watch: {
          obj: {
            // deep: true → 针对复杂数据类型进行深度监视；只要对象中任意一个发生变化，都会被侦听
            deep: true,

            // immediate: true → 立刻执行一次 handler
            immediate: true,

            // handler 事件处理函数
            handler(newVal, oldVal) {
              if (this.timer) clearTimeout(this.timer);
              this.timer = setTimeout( async () => {
                const res = await axios({
                  url: 'https://applet-base-api-t.itheima.net/api/translate',
                  method: 'get',
                  params: newVal,
                })

                this.result = res.data.data
              }, 300)
            }
          }
        }
      })
    </script>
  </body>
</html>
