<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>


<script src="https://cdn.jsdelivr.net/npm/axios@1.10.0/dist/axios.min.js"></script>

<script>
  /**
   * 目标：掌握Promise的链式调用
   * 需求：把省市的嵌套结构，改成链式调用的线性结构
   */

  /**
   * new Promise() -> .then(回调函数) -> 新的Promise对象(回调函数中的return结果)
   * 即：在then的回调函数中，返回新的Promise对象；在外层就可以继续对该Promise对象使用then方法
   */

  const p = new Promise((resolve, reject) => {
    setTimeout(() => {
      resolve('pname')
    }, 1000)
  })

  const p2 = p.then(result => {
    console.log(result)

    return new Promise((resolve, reject) => {
      setTimeout(() => {
        resolve(result + '---' + 'cname')
      }, 1000)
    })
  })

  p2.then(result => {
    console.log(result)
  })

</script>

</body>
</html>
