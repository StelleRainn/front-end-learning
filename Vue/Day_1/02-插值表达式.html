<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>

<!--
    插值表达式：Vue的一种模板语法
    作用： 利用 表达式 进行插值渲染
    语法： {{ 表达式 }}


    注意点：
    1. 使用的数据要存在，被声明
    2. 支持的是表达式，不能是语句，例如if，for等
    3. 不能在标签属性中使用{{}}, 例如 <p title = "{{ title }}">
-->

<div id="app">
  <p>{{nickname}}</p>
  <p>{{nickname.toUpperCase()}}</p>
  <p>{{nickname + ' how are you!'}}</p>
  <p>{{ age >= 18 ? '成年' : '未成年' }}</p>
  <p>{{friends.name + ' ' + friends.desc}}</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<script>
  const app = new Vue({
    el: '#app',
    data: {
      nickname: 'rainn',
      age: 18,
      friends: {
        name: 'mizukawa',
        desc: 'good guy'
      }
    }
  })
</script>
</body>
</html>
