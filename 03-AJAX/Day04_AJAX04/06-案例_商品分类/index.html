<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>案例_分类导航</title>
  <link rel="stylesheet" href="./css/index.css">
</head>

<body>
  <!-- 大容器 -->
  <div class="container">
    <div class="sub-list">
      <div class="item">
        <h3>分类名字</h3>
        <ul>
          <li>
            <a href="javascript:;">
              <img src="http://zhoushugang.gitee.io/erabbit-client-pc-static/uploads/img/category%20(9).png" />
              <p>巧克力</p>
            </a>
          </li>
          <li>
            <a href="javascript:;">
              <img src="http://zhoushugang.gitee.io/erabbit-client-pc-static/uploads/img/category%20(9).png" />
              <p>巧克力</p>
            </a>
          </li>
          <li>
            <a href="javascript:;">
              <img src="http://zhoushugang.gitee.io/erabbit-client-pc-static/uploads/img/category%20(9).png" />
              <p>巧克力</p>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    /**
     * 目标：把所有商品分类“同时”渲染到页面上
     *  1. 获取所有一级分类数据
     *  2. 遍历id，创建获取二级分类请求
     *  3. 合并所有二级分类Promise对象
     *  4. 等待同时成功后，渲染页面
    */

    async function fetchData () {
      try {
        const topObj = await axios({url: 'https://hmajax.itheima.net/api/category/top'})
        const topIDs = topObj.data.data.map(ele => ele.id)

        const subObj = topIDs.map(ele => {
          return axios({url: 'https://hmajax.itheima.net/api/category/sub', params: {id: ele}})
        })

        const sub = Promise.all(subObj)

        // 利用循环，对每一个result对象制作HTML代码
        document.querySelector('.item').innerHTML = ''
        sub.then(result => {
          result.forEach(currentResult => {
            const currentTopName = currentResult.data.data.name
            const liStr = currentResult.data.data.children.map(e => {
              return `<li>
                       <a href="javascript:;">
                        <img src="${e.picture}" />
                        <p>${e.name}</p>
                       </a>
              </li>`
            }).join('')
            document.querySelector('.item').innerHTML +=
              `
              <h3>${currentTopName}</h3>
              <ul>${liStr}</ul>
              `
          })
        })
      } catch (e) {
        throw new Error(e.response.data.message)
      }
    }

    fetchData()
  </script>
</body>

</html>
